<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>車道視野</title>
<style>
  :root{
    --tar:#101418; --panel:#171d23; --line:#2a333d; --paint:#e8edf2; --dim:#8b98a5;
    --flow:#37c26b; --slow:#e8b83a; --jam:#e0503a;
    --sign-n:#0f6b3f;   /* 國道牌面綠 */
    --sign-c:#1d4f8c;   /* 市區指示藍 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--tar);color:var(--paint);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:600px;margin:0 auto;padding:14px 14px 40px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .s-flow{color:var(--flow)} .s-slow{color:var(--slow)} .s-jam{color:var(--jam)}

  header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  h1{font-size:19px;font-weight:800;letter-spacing:.06em;margin:0}
  .badge{color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:3px;letter-spacing:.08em;background:var(--sign-n)}
  .badge.city{background:var(--sign-c);border-radius:14px}
  .gear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .gear:hover{color:var(--paint);border-color:var(--dim)}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
  .seg button{flex:1;background:none;border:none;color:var(--dim);padding:9px 4px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--paint);color:#0b0f13}
  .seg button:focus-visible{outline:2px solid var(--flow);outline-offset:-2px}

  .picks{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  select{
    flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);color:var(--paint);
    border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit;
  }
  select:focus{outline:2px solid var(--flow)}
  .field{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .field.hide{display:none}
  .field input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    color:var(--paint);border-radius:8px;padding:9px 11px;font-size:15px;font-family:inherit;
    -webkit-appearance:none;appearance:none}
  .field input:focus{outline:2px solid var(--flow);border-color:transparent}
  .field input::placeholder{color:#5f6b77}
  .field select{flex:1.3}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:20px;
    padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip[aria-pressed="true"]{border-color:var(--paint);color:var(--paint)}
  .chip.geo[aria-pressed="true"]{border-color:var(--flow);color:var(--flow)}

  /* 車道總覽 */
  .lanes{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--panel);margin-bottom:8px}
  .lane{flex:1;padding:18px 8px 16px;text-align:center;transition:background .25s;
    border-right:1px solid var(--line)}
  .lane:last-child{border-right:none}
  .lane.pick{background:linear-gradient(180deg,rgba(55,194,107,.16),rgba(55,194,107,.03))}
  .lane-name{font-size:13px;color:var(--dim);font-weight:600}
  .lane-speed{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 0}
  .lane-unit{font-size:11px;color:var(--dim);letter-spacing:.1em}
  .lane-tag{margin-top:9px;font-size:12px;color:var(--dim);min-height:18px}
  .lane.pick .lane-tag{color:var(--flow)}

  .verdict{text-align:center;font-size:15px;font-weight:600;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel)}
  .verdict small{display:block;font-weight:400;color:var(--dim);font-size:13px;margin-top:3px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  caption{text-align:left;font-size:13px;color:var(--dim);padding:16px 2px 8px}
  th{font-size:12px;color:var(--dim);font-weight:600;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{padding:7px 5px;text-align:right;border-bottom:1px solid rgba(42,51,61,.5)}
  td:first-child{text-align:left;color:var(--dim);font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.worst td{background:rgba(224,80,58,.08)}

  .status{margin-top:18px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--flow);flex:none}
  .dot.stale{background:var(--slow)} .dot.err{background:var(--jam)}
  .refresh{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}

  .msg{border:1px solid var(--jam);background:rgba(224,80,58,.08);color:#ffb4a4;
    border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.6}
  .msg code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
  .msg.hide{display:none}

  dialog{border:1px solid var(--line);background:var(--panel);color:var(--paint);
    border-radius:14px;padding:20px;max-width:420px;width:calc(100% - 28px)}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  dialog h2{font-size:16px;margin:0 0 4px}
  dialog p{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.6}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input[type=text],input[type=password]{width:100%;background:#0b0f13;border:1px solid var(--line);
    color:var(--paint);border-radius:7px;padding:9px 11px;font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--flow);border-color:transparent}
  .swap{font-size:13px;color:var(--dim);margin-top:14px;display:flex;align-items:center;gap:8px}
  .swap input{width:auto}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions button{flex:1;padding:11px;border-radius:8px;font-size:15px;font-weight:600;
    cursor:pointer;font-family:inherit;border:1px solid var(--line);background:none;color:var(--dim)}
  .actions button.primary{background:var(--paint);color:#0b0f13;border-color:var(--paint)}
  .foot{font-size:12px;color:#5f6b77;line-height:1.7;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge" id="badge">國道</span>
    <h1>車道視野</h1>
    <button class="gear" id="btnCfg">設定</button>
  </header>

  <div class="msg hide" id="msg"></div>

  <div class="seg" role="group" aria-label="道路類型">
    <button id="tabFwy" aria-pressed="true">國道</button>
    <button id="tabHwy" aria-pressed="false">省道快速</button>
    <button id="tabCity" aria-pressed="false">一般道路</button>
  </div>

  <div class="field" id="fScope">
    <input type="search" id="qScope" placeholder="搜尋縣市" autocomplete="off" spellcheck="false" aria-label="搜尋縣市">
    <select id="selScope" aria-label="路線或縣市"></select>
  </div>
  <div class="field hide" id="fRoad">
    <input type="search" id="qRoad" placeholder="搜尋道路" autocomplete="off" spellcheck="false" aria-label="搜尋道路">
    <select id="selRoad" aria-label="道路"></select>
  </div>

  <div class="chips" id="dirChips"></div>

  <div class="lanes" id="lanes"></div>
  <div class="verdict" id="verdict">選好路線後會顯示各車道車速</div>

  <table>
    <caption id="cap">逐點車速</caption>
    <thead><tr id="thead"><th>位置</th></tr></thead>
    <tbody id="rows"><tr><td style="text-align:center;color:var(--dim);padding:22px">—</td></tr></tbody>
  </table>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="stat">待命</span>
    <button class="refresh" id="btnRefresh">重新讀取</button>
  </div>

  <p class="foot">
    資料為交通部 TDX 平臺的車輛偵測器（VD）統計值，國道約每分鐘、縣市道路約每五分鐘更新一次，
    顯示的是剛才而不是等一下的路況。長隧道或長路段進去之後車流仍會變，只當參考。<br>
    行駛中請勿操作手機。
  </p>
</div>

<dialog id="cfg">
  <h2>TDX 金鑰</h2>
  <p>到 tdx.transportdata.tw 註冊會員，在會員中心建立 API 金鑰。金鑰只存在這台裝置的瀏覽器，不會寫進網頁檔案。</p>
  <label for="cid">Client ID</label>
  <input type="text" id="cid" autocomplete="off" spellcheck="false" placeholder="xxxx-yyyyyyyy">
  <label for="csec">Client Secret</label>
  <input type="password" id="csec" autocomplete="off" spellcheck="false">
  <label class="swap"><input type="checkbox" id="swapLane"> 車道由內而外排列（預設由外而內）</label>
  <div class="actions">
    <button id="cfgCancel">取消</button>
    <button class="primary" id="cfgSave">儲存並讀取</button>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  var AUTH = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
  var API  = "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic";
  var LS   = "roadView.";
  var $ = function(id){ return document.getElementById(id); };

  var FREEWAYS = [
    ["N1","國道1號"],["N1H","國道1號高架"],["N2","國道2號"],["N3","國道3號"],
    ["N3A","國道3甲"],["N4","國道4號"],["N5","國道5號"],["N6","國道6號"],
    ["N8","國道8號"],["N10","國道10號"]
  ];
  // TDX 市區 VD 只接受這 16 個縣市（新北、苗栗、彰化、宜蘭、澎湖、連江未開放）
  var CITIES = [
    ["Keelung","基隆市"],["Taipei","臺北市"],["Taoyuan","桃園市"],
    ["Hsinchu","新竹市"],["HsinchuCounty","新竹縣"],
    ["Taichung","臺中市"],["NantouCounty","南投縣"],["YunlinCounty","雲林縣"],
    ["Chiayi","嘉義市"],["ChiayiCounty","嘉義縣"],
    ["Tainan","臺南市"],["Kaohsiung","高雄市"],["PingtungCounty","屏東縣"],
    ["HualienCounty","花蓮縣"],["TaitungCounty","臺東縣"],["KinmenCounty","金門縣"]
  ];

  var S = {
    mode: localStorage.getItem(LS+"mode") || "fwy",
    scope: localStorage.getItem(LS+"scope") || "N5",   // N5 或 Taipei
    road: localStorage.getItem(LS+"road") || "",       // 一般道路的道路名稱
    dir: localStorage.getItem(LS+"dir") || "",
    swap: localStorage.getItem(LS+"swap") === "1",
    geo: false, here: null,
    statics: null, staticsKey: "",
    token: null, tokenExp: 0, timer: null, busy: false, pauseUntil: 0, lastLoad: 0
  };

  /* ───────── 訊息 ───────── */
  function say(html){
    var m = $("msg");
    if(!html){ m.className = "msg hide"; m.innerHTML = ""; return; }
    m.className = "msg"; m.innerHTML = html;
  }
  function setStat(t, kind){ $("stat").textContent = t; $("dot").className = "dot" + (kind ? " " + kind : ""); }

  /* ───────── 認證 ───────── */
  function getToken(){
    if(S.token && Date.now() < S.tokenExp - 30000) return Promise.resolve(S.token);
    var id = localStorage.getItem(LS+"cid"), sec = localStorage.getItem(LS+"csec");
    if(!id || !sec) return Promise.reject(new Error("NOKEY"));
    var b = new URLSearchParams();
    b.set("grant_type","client_credentials"); b.set("client_id",id); b.set("client_secret",sec);
    return fetch(AUTH,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:b.toString()})
      .then(function(r){
        if(r.status === 400 || r.status === 401) throw new Error("BADKEY");
        if(!r.ok) throw new Error("AUTH " + r.status);
        return r.json();
      }).then(function(j){
        S.token = j.access_token;
        S.tokenExp = Date.now() + (j.expires_in || 86400) * 1000;
        return S.token;
      });
  }

  // 依序嘗試多個候選路徑，回傳第一個成功的；全失敗時把每一次的回應都帶出來
  function apiTry(paths){
    var i = 0, errs = [];
    function next(){
      if(i >= paths.length){
        return Promise.reject(new Error(errs.length ? errs.join(" ／ ") : "NOPATH"));
      }
      var p = paths[i++];
      return getToken().then(function(tk){
        return fetch(API + p, {headers:{authorization:"Bearer " + tk, accept:"application/json"}});
      }).then(function(r){
        if(r.ok){ S.usedPath = p.split("?")[0]; return r.json(); }
        if(r.status === 401){ S.token = null; throw new Error("BADKEY"); }
        if(r.status === 429) throw new Error("RATE");
        // 把伺服器講的話帶出來，不要只留狀態碼
        return r.text().then(function(t){
          var detail = (t || "").replace(/\s+/g," ").slice(0,200);
          var msg = "HTTP " + r.status + " @ " + p.split("?")[0] + (detail ? " — " + detail : "");
          if(r.status === 404 || r.status === 400){ errs.push(msg); return next(); }
          throw new Error(msg);
        });
      });
    }
    return next();
  }

  function unwrap(j){
    if(Array.isArray(j)) return j;
    if(!j || typeof j !== "object") return [];
    for(var k in j){ if(Array.isArray(j[k])) return j[k]; }
    for(var k2 in j){ if(j[k2] && typeof j[k2] === "object"){ var r = unwrap(j[k2]); if(r.length) return r; } }
    return [];
  }

  /* ───────── 解析 ───────── */
  function parseMile(s){
    var m = /(\d+)K\+?(\d+)?/.exec(s || "");
    return m ? parseInt(m[1],10) + (m[2] ? parseInt(m[2],10)/1000 : 0) : null;
  }
  function parseFwyID(id){
    var m = /-(N\d+H?A?)-([NSEW])-(\d+(?:\.\d+)?)/.exec(id || "") || /(N\d+H?A?)-([NSEW])-(\d+(?:\.\d+)?)/.exec(id || "");
    return m ? { road:m[1], dir:m[2], mile:parseFloat(m[3]) } : null;
  }
  function dirLabel(d){
    return {N:"北向",S:"南向",E:"東向",W:"西向",
            NE:"東北向",NW:"西北向",SE:"東南向",SW:"西南向",
            "0":"順向","1":"逆向"}[String(d)] || String(d);
  }
  // 沒有里程時，用偵測器編號的辨識段當位置標籤
  function shortID(id){
    if(!id) return "";
    var parts = String(id).split("-").filter(function(x){ return x && !/^(VD|nfbVD|thbVD)$/i.test(x); });
    if(!parts.length) return String(id).slice(-10);
    return parts.slice(-3).join("-").slice(-16);
  }
  function dist(a,b,c,d){ // 粗略公里
    var x = (a-c)*111, y = (b-d)*101;
    return Math.sqrt(x*x + y*y);
  }

  /* ───────── 靜態偵測器 ───────── */
  // 公路局(省道／快速道路)的端點還沒確認，依序試這些候選；全錯時 TDX 會回覆它接受的寫法
  var HWY_TRY = ["Highway","ProvincialHighway","Expressway","Road","Country","Freeway/Highway"];

  function staticPaths(){
    if(S.mode === "fwy"){
      var f = "%24filter=contains(VDID%2C'" + S.scope + "-')&%24format=JSON";
      return ["/VD/Freeway?" + f, "/VD/Freeway/All?" + f];
    }
    if(S.mode === "hwy"){
      var out = [];
      HWY_TRY.forEach(function(n){
        out.push("/VD/" + n + "?%24format=JSON");
        out.push("/VD/" + n + "/All?%24format=JSON");
      });
      return out;
    }
    return ["/VD/City/" + S.scope + "?%24format=JSON"];
  }
  function livePaths(){
    if(S.mode === "fwy"){
      var f = "%24filter=contains(VDID%2C'" + S.scope + "-')&%24format=JSON";
      return ["/Live/VD/Freeway?" + f, "/Live/VD/Freeway/All?" + f];
    }
    if(S.mode === "hwy"){
      var out = [];
      HWY_TRY.forEach(function(n){
        out.push("/Live/VD/" + n + "?%24format=JSON");
        out.push("/Live/VD/" + n + "/All?%24format=JSON");
      });
      return out;
    }
    return ["/Live/VD/City/" + S.scope + "?%24format=JSON"];
  }

  function dropRoad(meta){
    // 公路局的資料含少量掛在國道匝道／連絡道上的偵測器，省道分頁不顯示
    if(S.mode !== "hwy" || !meta) return false;
    return meta.cls === "0" || /^國道/.test(meta.road || "");
  }

  function loadStatics(){
    var key = S.mode + ":" + S.scope;
    if(S.statics && S.staticsKey === key) return Promise.resolve(S.statics);
    try{
      var c = JSON.parse(localStorage.getItem(LS+"vd:"+key) || "null");
      if(c && Date.now() - c.t < 86400000){ S.statics = c.d; S.staticsKey = key; return Promise.resolve(c.d); }
    }catch(e){}

    return apiTry(staticPaths()).then(function(j){
      var map = {};
      unwrap(j).forEach(function(v){
        if(!v || !v.VDID) return;
        var p = parseFwyID(v.VDID);
        var mile = parseMile(v.LocationMile);
        if(mile === null && p) mile = p.mile;
        var dir = "";
        if(v.DetectionLinks && v.DetectionLinks.length){
          var rd = v.DetectionLinks[0].RoadDirection;
          if(rd !== undefined && rd !== null && rd !== "") dir = String(rd);
        }
        if(!dir && p) dir = p.dir;
        var sec = v.RoadSection ? ((v.RoadSection.Start||"") + (v.RoadSection.End ? "→"+v.RoadSection.End : "")) : "";
        map[v.VDID] = {
          mile: mile, dir: dir, road: v.RoadName || (p ? p.road : "") || "",
          cls: (v.RoadClass === undefined || v.RoadClass === null) ? "" : String(v.RoadClass),
          section: sec, lat: Number(v.PositionLat), lon: Number(v.PositionLon)
        };
      });
      S.statics = map; S.staticsKey = key;
      try{ localStorage.setItem(LS+"vd:"+key, JSON.stringify({t:Date.now(), d:map})); }catch(e){}
      return map;
    });
  }

  /* ───────── 讀取 ───────── */
  function load(force){
    if(S.busy) return Promise.resolve();
    if(!force && Date.now() < S.pauseUntil){
      var left = Math.ceil((S.pauseUntil - Date.now())/1000);
      setStat("暫停中，" + left + " 秒後恢復","stale");
      return Promise.resolve();
    }
    S.busy = true; S.lastLoad = Date.now(); setStat("讀取中…"); say("");
    return loadStatics()
      .then(function(){ return apiTry(livePaths()); })
      .then(function(j){ render(unwrap(j)); })
      .catch(fail)
      .then(function(){ S.busy = false; });
  }

  function clearReadings(){
    $("lanes").innerHTML = "";
    $("verdict").textContent = "沒有可顯示的資料";
    $("thead").innerHTML = "<th>位置</th>";
    $("rows").innerHTML = '<tr><td style="text-align:center;color:var(--dim);padding:22px">—</td></tr>';
    $("cap").textContent = "逐點車速";
  }

  function fail(err){
    setStat("讀取失敗","err");
    clearReadings();
    if(S.mode !== "fwy") $("selRoad").innerHTML = '<option value="">無資料</option>';
    var m = String(err && err.message || err);
    if(m === "NOKEY"){
      setStat("尚未設定金鑰","stale");
      say("還沒有 TDX 金鑰。點右上角<b>設定</b>填入 Client ID 與 Secret。");
      $("cfg").showModal();
    }else if(m === "BADKEY"){
      say("金鑰被拒絕。到設定確認 Client ID 與 Secret 沒有貼錯或多了空白。");
    }else if(m === "RATE"){
      S.pauseUntil = Date.now() + 300000;
      setStat("已暫停自動更新 5 分鐘","stale");
      say("TDX 回覆請求過多（429）。可能是短時間內送太多次，也可能是當日額度用完。<br>" +
          "自動更新已暫停 5 分鐘，稍後按<b>重新讀取</b>試一次；若還是被擋，就是當日額度，明天會重置。");
    }else if(S.mode === "hwy"){
      say("省道／快速道路的端點沒試中。下面是每個候選路徑的回應，把整段貼給我就能定出正確寫法：<br><code>" + m + "</code>");
    }else if(m.indexOf("HTTP 400") >= 0 || m.indexOf("HTTP 404") >= 0 || m === "NOPATH"){
      say("這個來源沒有資料。不是每個縣市都有布設偵測器，換一個縣市或改用國道試試。<br><code>" + m + "</code>");
    }else if(m.indexOf("Failed to fetch") >= 0 || m.indexOf("NetworkError") >= 0){
      say("連不上 TDX。可能是網路斷了，或瀏覽器擋下跨網域請求（CORS）。<br>把這行訊息告訴我：<code>" + m + "</code>");
    }else{
      say("讀取失敗：<code>" + m + "</code>");
    }
  }

  /* ───────── 顯示 ───────── */
  function thresholds(){ return S.mode === "city" ? [30,15] : [70,40]; }
  function sClass(v){ var t = thresholds(); return v >= t[0] ? "s-flow" : (v >= t[1] ? "s-slow" : "s-jam"); }

  function laneNames(n){
    if(n === 2) return ["外側","內側"];
    if(n === 3) return ["外側","中線","內側"];
    var a = []; for(var i=0;i<n;i++) a.push("車道"+(i+1));
    return a;
  }

  function render(lives){
    var st = S.statics, pts = [], dirs = {}, roads = {};

    lives.forEach(function(v){
      var meta = st[v.VDID];
      if(!meta){
        var p = parseFwyID(v.VDID);
        if(!p) return;
        meta = { mile:p.mile, dir:p.dir, road:p.road, section:"", lat:NaN, lon:NaN };
      }
      if(dropRoad(meta)) return;
      if(meta.dir) dirs[meta.dir] = true;
      if(meta.road) roads[meta.road] = true;

      if(S.mode !== "fwy" && S.road && meta.road !== S.road) return;
      if(S.dir && meta.dir && meta.dir !== S.dir) return;

      var lanes = [], vol = 0;
      (v.LinkFlows || []).forEach(function(lf){
        (lf.Lanes || []).forEach(function(ln){
          if(ln.LaneType !== undefined && ln.LaneType !== 1) return;
          var s = Number(ln.Speed);
          if(!(s > 0 && s < 200)) return;
          lanes[Number(ln.LaneID) || 0] = s;
          (ln.Vehicles || []).forEach(function(x){ var q = Number(x.Volume); if(q > 0) vol += q; });
        });
      });
      if(!lanes.filter(function(x){ return x > 0; }).length) return;

      pts.push({
        id: v.VDID || "", mile: meta.mile, section: meta.section || meta.road || v.VDID,
        lanes: lanes, vol: vol, lat: meta.lat, lon: meta.lon
      });
    });

    buildDirChips(Object.keys(dirs));
    if(S.mode !== "fwy") buildRoadSelect();

    if(!pts.length){
      $("lanes").innerHTML = "";
      $("verdict").textContent = "這個條件下沒有偵測器回報";
      $("rows").innerHTML = '<tr><td style="text-align:center;color:var(--dim);padding:22px">換一個方向或道路試試</td></tr>';
      $("thead").innerHTML = "<th>位置</th>";
      setStat("無資料","stale");
      return;
    }

    // 排序：定位優先，其次里程
    if(S.geo && S.here){
      pts.forEach(function(p){ p.d = (isFinite(p.lat) && isFinite(p.lon)) ? dist(S.here.lat,S.here.lon,p.lat,p.lon) : 9999; });
      pts.sort(function(a,b){ return a.d - b.d; });
      pts = pts.slice(0,15);
    }else{
      pts.sort(function(a,b){
        var am = (a.mile === null || a.mile === undefined), bm = (b.mile === null || b.mile === undefined);
        if(am && bm) return String(a.id).localeCompare(String(b.id));
        if(am) return 1;   // 沒里程的排最後
        if(bm) return -1;
        return S.dir === "N" ? (b.mile - a.mile) : (a.mile - b.mile);
      });
    }

    // 車道統計
    var n = 0;
    pts.forEach(function(p){ n = Math.max(n, p.lanes.length); });
    var sum = [], cnt = [], worst = [];
    for(var i=0;i<n;i++){ sum[i]=0; cnt[i]=0; worst[i]=null; }
    pts.forEach(function(p){
      for(var i=0;i<n;i++){
        var s = p.lanes[i];
        if(!(s > 0)) continue;
        sum[i]+=s; cnt[i]++;
        if(!worst[i] || s < worst[i].s) worst[i] = { s:s, at:p };
      }
    });
    var avg = [];
    for(var i2=0;i2<n;i2++) avg[i2] = cnt[i2] ? sum[i2]/cnt[i2] : 0;

    var order = []; for(var i3=0;i3<n;i3++) order.push(i3);
    if(S.swap) order.reverse();
    var names = laneNames(n);

    // 車道卡
    var best = -1, bestV = -1;
    order.forEach(function(i){ if(avg[i] > bestV){ bestV = avg[i]; best = i; } });
    var spread = bestV - Math.min.apply(null, avg.filter(function(x){ return x > 0; }).concat([bestV]));

    $("lanes").innerHTML = order.map(function(i,col){
      var v = avg[i], w = worst[i];
      var meaningful = w && cnt[i] >= 3 && w.s < v - 3;
      var tag = meaningful ? "最慢 " + Math.round(w.s) + (w.at.mile != null ? " @ " + w.at.mile.toFixed(1) + "K" : "") : "";
      return '<div class="lane' + (i === best && spread >= 5 ? " pick" : "") + '">' +
        '<div class="lane-name">' + names[col] + '</div>' +
        '<div class="lane-speed num ' + (v ? sClass(v) : "") + '">' + (v ? Math.round(v) : "--") + '</div>' +
        '<div class="lane-unit">km/h</div>' +
        '<div class="lane-tag">' + tag + '</div></div>';
    }).join("");

    var overall = 0, oc = 0;
    for(var i4=0;i4<n;i4++){ if(cnt[i4]){ overall += sum[i4]; oc += cnt[i4]; } }
    overall = oc ? overall/oc : 0;

    var vd = $("verdict");
    if(n < 2 || spread < 5){
      vd.innerHTML = '整段平均 <b class="' + sClass(overall) + '">' + Math.round(overall) + '</b> km/h' +
        '<small>' + (n < 2 ? "此路段只有單一車道資料" : "各車道差不到 5 km/h，換道沒有意義") + '</small>';
    }else{
      var w2 = worst[best];
      var warn = w2 && cnt[best] >= 3 && w2.s < avg[best] - 10;
      vd.innerHTML = '走 <b class="' + sClass(bestV) + '">' + names[order.indexOf(best)] + '</b>，快約 ' + Math.round(spread) + ' km/h' +
        (warn ? '<small>但 ' + (w2.at.mile != null ? w2.at.mile.toFixed(1) + "K" : w2.at.section) +
              ' 有一台跑 ' + Math.round(w2.s) + '，可能一路擋到底</small>'
              : (pts.length < 3 ? '<small>只有 ' + pts.length + ' 處偵測器，樣本太少</small>' : ''));
    }

    // 逐點表
    $("thead").innerHTML = "<th>" + (S.geo ? "距離／位置" : "位置") + "</th>" +
      order.map(function(i,col){ return "<th>" + names[col] + "</th>"; }).join("") + "<th>車流</th>";

    var floor = null;
    pts.forEach(function(p){
      var vs = p.lanes.filter(function(x){ return x > 0; });
      var mn = Math.min.apply(null, vs);
      if(floor === null || mn < floor) floor = mn;
    });

    $("rows").innerHTML = pts.map(function(p){
      var vs = p.lanes.filter(function(x){ return x > 0; });
      var isWorst = Math.min.apply(null, vs) === floor;
      var head = S.geo && p.d < 9999 ? p.d.toFixed(1) + " km · " + (p.section || shortID(p.id))
               : (p.mile != null ? p.mile.toFixed(1) + "K" : shortID(p.id) || p.section || "");
      var cells = order.map(function(i){
        var x = p.lanes[i];
        return '<td class="num">' + (x > 0 ? '<span class="' + sClass(x) + '">' + Math.round(x) + '</span>'
                                           : '<span style="color:var(--dim)">–</span>') + '</td>';
      }).join("");
      return '<tr class="' + (isWorst ? "worst" : "") + '"><td title="' + (p.section || "") + '">' + head + '</td>' +
        cells + '<td class="num" style="color:var(--dim)">' + (p.vol || "–") + '</td></tr>';
    }).join("");

    $("cap").textContent = pts.length + " 處偵測器"
      + (S.usedPath ? " · 來源 " + S.usedPath : "")
      + " · 車流為統計區間內車輛數";
    setStat("更新於 " + new Date().toTimeString().slice(0,8));
  }

  /* ───────── 選單 ───────── */
  function buildScopeSelect(){
    if(S.mode === "hwy"){
      $("fScope").className = "field hide";
      $("fRoad").className = "field";
      $("badge").textContent = "省道";
      $("badge").className = "badge city";
      return;
    }
    $("fScope").className = "field";
    var list = S.mode === "fwy" ? FREEWAYS : CITIES;
    var q = ($("qScope").value || "").trim().toLowerCase();
    var hit = list.filter(function(x){
      return !q || x[1].indexOf(q) >= 0 || x[0].toLowerCase().indexOf(q) >= 0;
    });
    var empty = !hit.length;
    if(empty) hit = list;
    $("selScope").innerHTML = hit.map(function(x){
      return '<option value="' + x[0] + '"' + (x[0] === S.scope ? " selected" : "") + '>' + x[1] + '</option>';
    }).join("");
    $("qScope").placeholder = (S.mode === "fwy" ? "搜尋路線" : "搜尋縣市") + (empty && q ? "（查無符合）" : "");
    $("fRoad").className = "field" + (S.mode === "city" ? "" : " hide");
    $("badge").textContent = S.mode === "fwy" ? "國道" : "市區";
    $("badge").className = "badge" + (S.mode === "fwy" ? "" : " city");
    // 只剩一個結果就直接換過去
    if(!empty && hit.length === 1 && hit[0][0] !== S.scope){
      S.scope = hit[0][0]; S.road = ""; S.dir = ""; S.statics = null;
      localStorage.setItem(LS+"scope", S.scope);
      localStorage.setItem(LS+"road", "");
      $("qRoad").value = "";
      $("selRoad").innerHTML = '<option value="">載入中…</option>';
      $("dirChips").innerHTML = "";
      clearReadings();
      load();
    }
  }

  function buildRoadSelect(){
    var set = {};
    for(var k in S.statics){
      var meta = S.statics[k];
      if(!meta || !meta.road || dropRoad(meta)) continue;
      set[meta.road] = true;
    }
    var all = Object.keys(set).sort();
    var q = ($("qRoad").value || "").trim().toLowerCase();
    var hit = all.filter(function(r){ return !q || r.toLowerCase().indexOf(q) >= 0; });
    var empty = q && !hit.length;
    if(empty) hit = all;
    $("selRoad").innerHTML = '<option value="">全部道路（' + all.length + '）</option>' +
      hit.map(function(r){
        return '<option value="' + r + '"' + (r === S.road ? " selected" : "") + '>' + r + '</option>';
      }).join("");
    $("qRoad").placeholder = "搜尋道路" + (empty ? "（查無符合）" : "");
    if(!empty && q && hit.length === 1 && hit[0] !== S.road){
      S.road = hit[0];
      localStorage.setItem(LS+"road", S.road);
      load();
    }
  }
  function buildDirChips(dirs){
    dirs = dirs.filter(Boolean).sort();
    var html = '<button class="chip" data-dir="" aria-pressed="' + (!S.dir) + '">全部方向</button>';
    html += dirs.map(function(d){
      return '<button class="chip" data-dir="' + d + '" aria-pressed="' + (S.dir === d) + '">' + dirLabel(d) + '</button>';
    }).join("");
    html += '<button class="chip geo" id="chipGeo" aria-pressed="' + S.geo + '">附近 15 處</button>';
    $("dirChips").innerHTML = html;

    Array.prototype.forEach.call($("dirChips").querySelectorAll("[data-dir]"), function(b){
      b.onclick = function(){
        S.dir = b.dataset.dir;
        localStorage.setItem(LS+"dir", S.dir);
        load();
      };
    });
    $("chipGeo").onclick = toggleGeo;
  }

  function toggleGeo(){
    if(S.geo){ S.geo = false; load(); return; }
    if(!navigator.geolocation){ say("這個瀏覽器不支援定位。"); return; }
    setStat("定位中…");
    navigator.geolocation.getCurrentPosition(function(pos){
      S.here = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      S.geo = true; load();
    }, function(){
      say("拿不到定位。請在瀏覽器允許此網站取用位置，網址也要是 https。");
      setStat("定位失敗","stale");
    }, { enableHighAccuracy:true, timeout:8000, maximumAge:30000 });
  }

  /* ───────── 事件 ───────── */
  function setMode(m){
    S.mode = m;
    S.scope = (m === "fwy") ? "N5" : (m === "city" ? "Taipei" : "");
    S.road = ""; S.dir = ""; S.statics = null;
    localStorage.setItem(LS+"mode", m);
    localStorage.setItem(LS+"scope", S.scope);
    localStorage.setItem(LS+"road", "");
    $("tabFwy").setAttribute("aria-pressed", m === "fwy");
    $("tabHwy").setAttribute("aria-pressed", m === "hwy");
    $("tabCity").setAttribute("aria-pressed", m === "city");
    $("qScope").value = ""; $("qRoad").value = "";
    $("dirChips").innerHTML = "";
    clearReadings();
    buildScopeSelect();
    load();
  }
  $("tabFwy").onclick = function(){ setMode("fwy"); };
  $("tabHwy").onclick = function(){ setMode("hwy"); };
  $("tabCity").onclick = function(){ setMode("city"); };

  $("qScope").oninput = function(){ buildScopeSelect(); };
  $("qRoad").oninput  = function(){ buildRoadSelect(); };

  $("selScope").onchange = function(){
    S.scope = this.value; S.road = ""; S.dir = ""; S.statics = null;
    localStorage.setItem(LS+"scope", S.scope);
    localStorage.setItem(LS+"road", "");
    $("qRoad").value = "";
    $("selRoad").innerHTML = '<option value="">載入中…</option>';
    $("dirChips").innerHTML = "";
    clearReadings();
    load();
  };
  $("selRoad").onchange = function(){
    S.road = this.value;
    localStorage.setItem(LS+"road", S.road);
    load();
  };
  $("btnRefresh").onclick = function(){ S.pauseUntil = 0; load(true); };

  $("btnCfg").onclick = function(){
    $("cid").value = localStorage.getItem(LS+"cid") || "";
    $("csec").value = localStorage.getItem(LS+"csec") || "";
    $("swapLane").checked = S.swap;
    $("cfg").showModal();
  };
  $("cfgCancel").onclick = function(){ $("cfg").close(); };
  $("cfgSave").onclick = function(){
    localStorage.setItem(LS+"cid", $("cid").value.trim());
    localStorage.setItem(LS+"csec", $("csec").value.trim());
    S.swap = $("swapLane").checked;
    localStorage.setItem(LS+"swap", S.swap ? "1" : "0");
    S.token = null;
    $("cfg").close();
    load();
  };

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    var gap = S.mode === "fwy" ? 30000 : 120000;
    if(Date.now() - S.lastLoad < gap) return;
    load();
  });

  /* ───────── 啟動 ───────── */
  $("tabFwy").setAttribute("aria-pressed", S.mode === "fwy");
  $("tabHwy").setAttribute("aria-pressed", S.mode === "hwy");
  $("tabCity").setAttribute("aria-pressed", S.mode === "city");
  buildScopeSelect();
  buildDirChips([]);
  // 國道每分鐘更新一次；公路局與縣市是五分鐘一次的統計值，抓太密只是浪費額度
  setInterval(function(){
    if(document.visibilityState !== "visible") return;
    var gap = S.mode === "fwy" ? 60000 : 180000;
    if(Date.now() - S.lastLoad < gap - 2000) return;
    load();
  }, 30000);
  load();

})();
</script>
</body>
</html>
